<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Updated Anime Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          Live Airing Anime Radar
        </h1>
        <p class="text-slate-400 text-sm mt-1">100% Automated via GitHub Actions Cron</p>
      </div>
      <div id="timestamp" class="mt-3 md:mt-0 text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full text-cyan-400">
        Loading latest sync...
      </div>
    </header>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Cards injected automatically via JS -->
    </div>
  </div>

  <script>
    async function loadContent() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        const data = await res.json();
        document.getElementById('timestamp').textContent = `Last Auto-Synced: ${data.last_updated}`;
        
        const grid = document.getElementById('grid');
        grid.innerHTML = data.items.map(item => `
          <a href="${item.url}" target="_blank" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-cyan-500/50 transition flex flex-col">
            <img src="${item.image}" alt="${item.title}" class="h-64 w-full object-cover">
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                  <span class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">⭐ ${item.score}</span>
                  <span>Ep: ${item.episodes}</span>
                </div>
                <h2 class="font-bold text-base line-clamp-1 mb-1">${item.title}</h2>
                <p class="text-xs text-slate-400 line-clamp-3">${item.synopsis}</p>
              </div>
            </div>
          </a>
        `).join('');
      } catch (err) {
        document.getElementById('timestamp').textContent = 'Waiting for first automated run...';
      }
    }
    loadContent();
  </script>
</body>
</html>
